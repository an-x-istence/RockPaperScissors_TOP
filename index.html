<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1 class="header">Rock, Paper, Scissors.</h1>
    <div class="content">
        <div class="throws">
            <div class="human-throw">
                <p class="human-throw-pic">
                </p>
                <div class="human-choices">
                    <button class="rock">Rock</button>
                    <button class="paper">Paper</button>
                    <button class="scissors">Scissors</button>
                </div>
            </div>
            <div class="computer-throw">
                <p class="computer-throw-pic">
                </p>
            </div>
        </div>
        <div class="scores">
            <div class="human-score"></div>
            <div class="computer-score"></div>
        </div>

    </div>
    <script src="./index.js"></script>
</body>
</html>
